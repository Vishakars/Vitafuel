<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VitaFuel | Nutrition Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --bg-color: #fdf6ec;
      --text-color: #4b3621;
      --card-bg: #fff8f0;
      --primary: #a15e32;
      --secondary: #d2996a;
      --nav-bg: #f5e8d3;
      --footer-bg: #f5e8d3;
      --success: #4CAF50;
      --warning: #FF9800;
      --danger: #F44336;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      font-size: 1.09rem;
      line-height: 1.6;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      opacity: 1;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      max-width: 100vw;
      margin: 0;
      padding: 0 20px;
      min-height: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
      padding: 0 20px;
    }

    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      font-style: italic;
      text-shadow: 0 0 20px rgba(161, 94, 50, 0.5);
      font-weight: 600;
    }

    .header p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 20px;
    }

    .nav-tabs {
      background: var(--nav-bg);
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(161, 94, 50, 0.1);
      border: 1px solid #f1e3d3;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .nav-tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 120px;
      font-family: 'Georgia', serif;
      font-size: 16px;
    }

    .nav-tab.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 4px 12px rgba(140, 94, 42, 0.3);
    }

    .nav-tab:hover:not(.active) {
      background: #fff8f0;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .nutrition-tracker {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .meals-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .meal-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(161, 94, 50, 0.1);
      border: 1px solid #f1e3d3;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .meal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .meal-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(161, 94, 50, 0.15);
    }

    .meal-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .meal-icon {
      font-size: 1.5rem;
      margin-right: 10px;
    }

    .meal-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary);
    }

    .meal-input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .meal-input {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid #e0d5c7;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      background: #fff8f0;
      transition: border-color 0.3s ease;
    }

    .meal-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .meal-input::placeholder {
      color: #999;
    }

    .add-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 14px;
      font-family: 'Georgia', serif;
      white-space: nowrap;
    }

    .add-btn:hover {
      background: var(--secondary);
      transform: translateY(-1px);
    }

    .reset-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
      transition: all 0.3s ease;
      z-index: 1000;
      font-size: 14px;
    }

    .reset-button:hover {
      background: #c0392b;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .meals-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      
      .container {
        padding: 0 15px;
      }
      
      .meal-input-group {
        flex-direction: column;
        align-items: stretch;
      }
      
      .add-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="hero-img1">
      <img src="logo/image.png" alt="VitaFuel - Health & Wellness" style="height: 50px; width: auto;" />
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="nutrition.html">Nutrition</a>
      <a href="activity.html">Activities</a>
      <a href="analytics.html">Analytics</a>
    </nav>
    <div class="profile-container">
      <div class="profile-circle" id="user-profile">U</div>
      <div class="profile-dropdown" id="profileDropdown">
        <a href="profile.html">My Profile</a>
        <a href="settings.html">Settings</a>
        <a href="about.html">About</a>
        <a href="logout.html">Logout</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="header">
      <h1>🍎 Nutrition Tracker</h1>
      <p>Track your daily meals and monitor your nutritional intake</p>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab" data-tab="dashboard">
        📊 Dashboard
      </button>
      <button class="nav-tab" data-tab="activities">
        🏃 Activities
      </button>
      <button class="nav-tab active" data-tab="nutrition">
        🍎 Nutrition
      </button>
      <button class="nav-tab" data-tab="analytics">
        📈 Analytics
      </button>
    </div>

    <div class="nutrition-tracker">
      <div class="meals-grid">
        <!-- Breakfast Card -->
        <div class="meal-card">
          <div class="meal-header">
            <span class="meal-icon">🌅</span>
            <h3 class="meal-title">Breakfast</h3>
          </div>
          <div class="meal-input-group">
            <input 
              type="text" 
              class="meal-input" 
              placeholder="Enter food item (e.g., '2 eggs')"
              id="breakfast-input"
            />
            <button class="add-btn" onclick="addMeal('breakfast')">Add</button>
          </div>
        </div>

        <!-- Lunch Card -->
        <div class="meal-card">
          <div class="meal-header">
            <span class="meal-icon">☀️</span>
            <h3 class="meal-title">Lunch</h3>
          </div>
          <div class="meal-input-group">
            <input 
              type="text" 
              class="meal-input" 
              placeholder="Enter food item (e.g., '1 cup rice')"
              id="lunch-input"
            />
            <button class="add-btn" onclick="addMeal('lunch')">Add</button>
          </div>
        </div>

        <!-- Snacks Card -->
        <div class="meal-card">
          <div class="meal-header">
            <span class="meal-icon">🍿</span>
            <h3 class="meal-title">Snacks</h3>
          </div>
          <div class="meal-input-group">
            <input 
              type="text" 
              class="meal-input" 
              placeholder="Enter food item (e.g., '1 apple')"
              id="snacks-input"
            />
            <button class="add-btn" onclick="addMeal('snacks')">Add</button>
          </div>
        </div>

        <!-- Dinner Card -->
        <div class="meal-card">
          <div class="meal-header">
            <span class="meal-icon">🌙</span>
            <h3 class="meal-title">Dinner</h3>
          </div>
          <div class="meal-input-group">
            <input 
              type="text" 
              class="meal-input" 
              placeholder="Enter food item (e.g., 'roti, sabzi')"
              id="dinner-input"
            />
            <button class="add-btn" onclick="addMeal('dinner')">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="reset-button" onclick="resetAllData()">
    🔄 Reset All Data
  </button>

  <div id="notification" class="notification"></div>

  <script>
    // Global variables
    let currentUser = localStorage.getItem('userEmail');
    let accessToken = localStorage.getItem('accessToken');

    const getApiBaseUrl = () => window.API_BASE_URL || deriveApiBase();
    function deriveApiBase() {
      if (window.API_BASE_URL) return window.API_BASE_URL;
      if (window.location.port && window.location.port !== '3000') {
        return `${window.location.origin}/api`;
      }
      return `${window.location.protocol}//${window.location.hostname}:8005/api`;
    }
    const apiBaseUrl = getApiBaseUrl();

    // Check authentication
    if (!currentUser || !accessToken) {
      console.log('Authentication failed - redirecting to login');
      window.location.href = 'login.html';
    } else {
      console.log('User authenticated:', currentUser);
    }

    // Load today's nutrition data
    async function loadTodaysNutrition() {
      try {
        const currentDate = new Date().toISOString().split('T')[0];
        const response = await fetch(`${apiBaseUrl}/nutrition/me/nutrition/${currentDate}`, {
          headers: {
            'Authorization': `Bearer ${accessToken}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          console.log('Today\'s nutrition data:', data);
          
          // Display meals in a summary (you can enhance this to show in the UI)
          if (data.meals && data.meals.length > 0) {
            console.log(`Found ${data.meals.length} meals for today`);
            data.meals.forEach(meal => {
              console.log(`${meal.meal_type}: ${meal.food_item.name} (${meal.quantity} serving)`);
            });
          }
        }
      } catch (error) {
        console.error('Error loading nutrition data:', error);
        showNotification('Unable to load today\'s meals. Please try again.', 'error');
      }
    }

    // Tab switching functionality
    // Check if it's a new day and auto-reset nutrition data
    function checkNutritionDailyReset() {
      const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD format
      const lastDate = localStorage.getItem('nutrition_lastDate');
      
      if (lastDate && lastDate !== today) {
        console.log('🥗 New day detected! Auto-resetting nutrition data...');
        console.log('Last date:', lastDate, 'Today:', today);
        
        // Clear nutrition data
        const currentUser = localStorage.getItem('userEmail');
        if (currentUser) {
          localStorage.removeItem(`${currentUser}_nutritionData`);
          localStorage.removeItem(`${currentUser}_mealsData`);
          localStorage.removeItem(`${currentUser}_foodLogs`);
        }
        
        // Update last date
        localStorage.setItem('nutrition_lastDate', today);
        
        // Show notification
        if (typeof showNotification === 'function') {
          showNotification('🌅 Good morning! Nutrition data has been reset for a fresh start!', 'success');
        } else {
          console.log('🌅 Good morning! Nutrition data has been reset for a fresh start!');
        }
      } else if (!lastDate) {
        // First time - set today as last date
        localStorage.setItem('nutrition_lastDate', today);
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Check for daily reset
      checkNutritionDailyReset();
      
      // Set user initial in profile circle
      const profileCircle = document.getElementById('user-profile');
      if (profileCircle && currentUser) {
        profileCircle.textContent = currentUser.charAt(0).toUpperCase();
      }

      // Load today's nutrition data
      loadTodaysNutrition();

      // Tab switching
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const tabName = tab.dataset.tab;
          if (tabName === 'dashboard') {
            window.location.href = 'dashboard.html';
          } else if (tabName === 'activities') {
            window.location.href = 'activity.html';
          } else if (tabName === 'analytics') {
            window.location.href = 'analytics.html';
          }
        });
      });

      // Profile dropdown functionality
      const profileDropdown = document.getElementById('profileDropdown');
      
      if (profileCircle && profileDropdown) {
        // Toggle dropdown on click
        profileCircle.addEventListener('click', function(e) {
          e.stopPropagation();
          profileDropdown.classList.toggle('show');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
          if (!profileCircle.contains(e.target) && !profileDropdown.contains(e.target)) {
            profileDropdown.classList.remove('show');
          }
        });
        
        // Handle logout
        const logoutLink = profileDropdown.querySelector('a[href="logout.html"]');
        if (logoutLink) {
          logoutLink.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('accessToken');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          });
        }
      }
    });

    // Add meal function
    async function addMeal(mealType) {
      const inputId = mealType + '-input';
      const input = document.getElementById(inputId);
      const foodItem = input.value.trim();

      if (!foodItem) {
        showNotification('Please enter a food item', 'error');
        return;
      }

      try {
        const currentDate = new Date().toISOString().split('T')[0];
        // First, search for the food item in the database
        const foodSearchResponse = await fetch(`${apiBaseUrl}/nutrition/food-database?query=${encodeURIComponent(foodItem)}&limit=1`, {
          headers: {
            'Authorization': `Bearer ${accessToken}`
          }
        });

        let foodItemData;
        let usedFallback = false;
        let fallbackReason = '';
        if (foodSearchResponse.ok) {
          const searchResults = await foodSearchResponse.json();
          if (searchResults.length > 0) {
            foodItemData = searchResults[0];
          } else {
            usedFallback = true;
            fallbackReason = 'Food not found online. Using default values.';
            foodItemData = {
              name: foodItem,
              calories: 100, // Default calories
              protein: 5,
              carbs: 15,
              fat: 3,
              fiber: 2,
              sugar: 5,
              sodium: 10,
              serving_size: "100g",
              brand: null
            };
          }
        } else {
          usedFallback = true;
          fallbackReason = `Nutrition database unavailable (status ${foodSearchResponse.status}). Using default values.`;
          foodItemData = {
            name: foodItem,
            calories: 100,
            protein: 5,
            carbs: 15,
            fat: 3,
            fiber: 2,
            sugar: 5,
            sodium: 10,
            serving_size: "100g",
            brand: null
          };
        }

        const response = await fetch(`${apiBaseUrl}/nutrition/me/nutrition/${currentDate}/meal`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({
            food_item: foodItemData,
            quantity: 1,
            meal_type: mealType,
            notes: ''
          })
        });

        if (response.ok) {
          showNotification(`${foodItem} added to ${mealType}!`, 'success');
          if (usedFallback && fallbackReason) {
            showNotification(fallbackReason, 'warning');
          }
          input.value = '';
        } else {
          throw new Error('Failed to add food item');
        }
      } catch (error) {
        console.error('Error adding meal:', error);
        showNotification(error.message === 'Failed to add food item'
          ? 'Server rejected the meal. Please try again.'
          : 'Could not reach the nutrition service. Check your connection or API key.', 'error');
      }
    }

    // Reset all data function
    async function resetAllData() {
      if (confirm('Are you sure you want to reset all nutrition data? This action cannot be undone.')) {
        try {
          const currentDate = new Date().toISOString().split('T')[0];
          const response = await fetch(`${apiBaseUrl}/nutrition/me/nutrition/${currentDate}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${accessToken}`
            }
          });

          if (response.ok) {
            showNotification('All nutrition data has been reset', 'success');
          } else {
            showNotification('Error resetting nutrition data', 'error');
          }
        } catch (error) {
          console.error('Error resetting nutrition data:', error);
          showNotification('Error resetting nutrition data', 'error');
        }
        
        // Clear all input fields
        document.querySelectorAll('.meal-input').forEach(input => {
          input.value = '';
        });
      }
    }

    // Show notification function
    function showNotification(message, type = 'info') {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = `notification ${type}`;
      notification.style.display = 'block';
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, 3000);
    }

    // Allow Enter key to add meal
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const input = e.target;
        if (input.classList.contains('meal-input')) {
          const mealType = input.id.replace('-input', '');
          addMeal(mealType);
        }
      }
    });
  </script>
  <script src="scripts/navigation.js"></script>
</body>
</html>
