<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VitaFuel | My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link href="css/commonstyles.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <style>
    :root {
      --bg-color: #fdf7ed;
      --text-color: #333;
      --card-bg: #fffdf7;
      --primary: #8c5e2a;
      --secondary: #a66f3f;
      --nav-bg: #f5e6c9;
    }

    * {
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: all 0.3s ease;
    }

    .profile-container {
      position: relative;
      display: inline-block;
    }

    .profile-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .profile-circle:hover {
      background-color: var(--secondary);
      transform: scale(1.05);
    }

    .profile-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background-color: white;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      border-radius: 8px;
      overflow: hidden;
    }

    .profile-dropdown a {
      color: #333;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      transition: background-color 0.3s ease;
      margin: 0;
    }

    .profile-dropdown a:hover {
      background-color: #f1f1f1;
    }

    input,
    select,
    textarea {
      color: black !important;
      background-color: white;
    }

    input[disabled],
    input[readonly],
    select[disabled] {
      color: black !important;
      opacity: 1 !important;
    }

    .profile-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    #profile-form {
      background-color: var(--card-bg);
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #profile-form h2 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 28px;
      color: var(--primary);
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background-color: white;
      color: var(--text-color);
    }

    input[disabled] {
      background-color: #eee;
      cursor: not-allowed;
    }

    .error {
      color: red;
      font-size: 12px;
      margin-top: -16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 20px;
    }

    button:hover {
      background-color: var(--secondary);
      transform: scale(1.05);
      transition: background-color 0.3s, transform 0.2s;
    }

    .profile-image-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      aspect-ratio: 1 / 1;
    }

    .profile-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--primary);
      background-color: #f0f0f0;
      display: block;
    }

    .profile-image-label {
      display: block;
      cursor: pointer;
      position: relative;
    }

    .upload-overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      background-color: var(--primary);
      color: white;
      border-radius: 50%;
      padding: 6px;
      font-size: 14px;
      border: 2px solid white;
      transition: background-color 0.3s ease;
    }

    .upload-overlay:hover {
      background-color: var(--secondary);
    }

    .initials-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--primary);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      text-transform: uppercase;
      overflow: hidden;
    }


    @media (max-width: 500px) {
      #profile-form {
        padding: 20px;
      }

      nav a {
        margin: 0 6px;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="hero-img1">
      <h1 class="logo-text">VitaFuel</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="health-insights.html">Wellness Hub</a>
      <a href="recommendations.html">Recommendations</a>
      <a href="chatbot.html">Chatbot</a>
      <a href="shopping-list.html">Shopping List</a>
      <div class="profile-container">
        <div class="profile-circle" id="user-profile"></div>
        <div class="profile-dropdown" id="profileDropdown">
          <a href="profile.html">My Profile</a>
          <a href="settings.html">Settings</a>
          <a href="about.html">About</a>
          <a href="#" onclick="logout()">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  <section class="profile-section">
    <form id="profile-form">
      <h2>My Profile</h2>

      <div class="profile-image-wrapper">
        <label for="avatarUpload" class="profile-image-label">
          <div id="avatarPreview" class="initials-avatar">VF</div>
          <div class="upload-overlay">📸</div>
        </label>
        <input type="file" id="avatarUpload" accept="image/*" hidden />
      </div>

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required />
      <div class="error" id="nameError"></div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
      <div class="error" id="emailError"></div>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>

      <label for="age">Age</label>
      <input type="text" id="age" name="age" readonly>

      <label for="heightValue">Height</label>
      <div style="display: flex; gap: 10px;">
        <input type="number" id="heightValue" name="heightValue" min="0" placeholder="Height" />
        <select id="heightUnit" name="heightUnit">
          <option value="cm">cm</option>
          <option value="ft">feet/inches</option>
        </select>
      </div>
      <div id="feetInchesInputs" style="display: none; margin-top: 10px; gap: 10px;">
        <input type="number" id="feet" placeholder="ft" min="0" max="8" style="width: 80px;" />
        <input type="number" id="inches" placeholder="in" min="0" max="11" style="width: 80px;" />
      </div>

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">-- Select --</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
      </select>

      <label><strong>Health Domain(s)</strong></label>

      <!-- Display selected health domains -->
      <div id="selectedHealthDomainsDisplay"
        style="margin-bottom: 15px; padding: 10px; background-color: #f5e8d3; border-radius: 8px; min-height: 40px;">
        <div style="font-size: 14px; color: #666; margin-bottom: 8px;">Currently Selected:</div>
        <div id="healthDomainsList" style="display: flex; flex-wrap: wrap; gap: 8px;">
          <!-- Selected domains will be displayed here -->
        </div>
      </div>

      <select id="healthDomains" multiple="multiple" style="width: 100%;">
        <option value="diabetes" data-icon="fa-droplet">Diabetes</option>
        <option value="menstruation" data-icon="fa-venus">Menstruation</option>
        <option value="blood-pressure" data-icon="fa-heart-pulse">Blood Pressure</option>
        <option value="thyroid" data-icon="fa-dna">Thyroid</option>
        <option value="skin-health" data-icon="fa-seedling">Skin Health</option>
        <option value="anemia" data-icon="fa-vial">Anemia</option>
        <option value="sleep" data-icon="fa-moon">Sleep</option>
        <option value="sinusitis" data-icon="fa-wind">Sinusitis</option>
        <option value="mental-health" data-icon="fa-brain">Mental Health</option>
        <option value="weight-management" data-icon="fa-scale-balanced">Weight Management</option>
      </select>

      <button type="submit">Save Profile</button>
    </form>
  </section>

  <footer class="footer">
    <p>&copy; 2025 VitaFuel. Empowering Healthy Lives.</p>
  </footer>

  <script>
    const profileForm = document.getElementById('profile-form');
    const avatarUpload = document.getElementById('avatarUpload');
    const avatarPreview = document.getElementById('avatarPreview');
    const currentUser = localStorage.getItem('userEmail') || localStorage.getItem('currentUser');

    function getUserKey(key) {
      return `${currentUser}_${key}`;
    }

    function getUserInitials(fullName) {
      if (!fullName) return "VF";
      const parts = fullName.trim().split(' ');
      if (parts.length === 1) return parts[0][0].toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    // Function to display selected health domains with Font Awesome icons
    function displaySelectedHealthDomains(domains) {
      const container = document.getElementById('healthDomainsList');
      if (!container) return;

      const domainMap = {
        'diabetes': { name: 'Diabetes', icon: 'fa-solid fa-droplet' },
        'menstruation': { name: 'Menstruation', icon: 'fa-solid fa-venus' },
        'blood-pressure': { name: 'Blood Pressure', icon: 'fa-solid fa-heart-pulse' },
        'thyroid': { name: 'Thyroid', icon: 'fa-solid fa-dna' },
        'skin-health': { name: 'Skin Health', icon: 'fa-solid fa-seedling' },
        'anemia': { name: 'Anemia', icon: 'fa-solid fa-vial' },
        'sleep': { name: 'Sleep', icon: 'fa-solid fa-moon' },
        'sinusitis': { name: 'Sinusitis', icon: 'fa-solid fa-wind' },
        'mental-health': { name: 'Mental Health', icon: 'fa-solid fa-brain' },
        'weight-management': { name: 'Weight Management', icon: 'fa-solid fa-scale-balanced' }
      };

      if (!domains || domains.length === 0) {
        container.innerHTML = '<span style="color: #999; font-style: italic;">No health domains selected</span>';
        return;
      }

      // Normalize domain values
      const domainKeys = domains.map(domain => {
        if (typeof domain === 'string') return domain.toLowerCase().trim();
        if (domain && domain.name) return domain.name.toLowerCase().trim();
        return domain;
      });

      // Render selected domains with FA icons
      container.innerHTML = domainKeys.map(key => {
        const domainInfo = domainMap[key] || { name: key, icon: 'fa-solid fa-notes-medical' };
        return `
        <span class="domain-tag">
          <i class="${domainInfo.icon}"></i>
          ${domainInfo.name}
        </span>
      `;
      }).join('');
    }

    function toggleHeightInput() {
      const unit = document.getElementById('heightUnit').value;
      const valueInput = document.getElementById('heightValue');
      const ftInches = document.getElementById('feetInchesInputs');

      if (unit === 'ft') {
        valueInput.style.display = 'none';
        ftInches.style.display = 'flex';
      } else {
        valueInput.style.display = 'block';
        ftInches.style.display = 'none';
      }
    }

    async function fetchAndPopulateProfile() {
      console.log('🔍 Current User:', currentUser);
      if (!currentUser) {
        alert('No user is currently logged in.');
        return;
      }

      try {
        const accessToken = localStorage.getItem('accessToken');
        const apiBaseUrl = window.API_BASE_URL || `${window.location.protocol}//${window.location.hostname}:8005/api`;
        const response = await fetch(`${apiBaseUrl}/profile/me`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Failed to fetch profile data: ${response.status} ${errorText}`);
        }

        const data = await response.json();
        const profile = data.profile || {};
        const fullName = `${profile.demographics?.firstName || ''} ${profile.demographics?.lastName || ''}`.trim() || data.name || '';

        profileForm.name.value = fullName;
        profileForm.email.value = data.email || '';
        profileForm.gender.value = profile.demographics?.gender || '';

        // DOB and Age
        const dobInput = document.getElementById('dob');
        if (profile.demographics?.dob) {
          const dobDate = new Date(profile.demographics.dob?.$date || profile.demographics.dob);
          if (!isNaN(dobDate)) dobInput.value = dobDate.toISOString().split('T')[0];
        }
        if (dobInput.value) {
          const birthDate = new Date(dobInput.value);
          const today = new Date();
          let age = today.getFullYear() - birthDate.getFullYear();
          const m = today.getMonth() - birthDate.getMonth();
          if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
          document.getElementById('age').value = age;
        }

        // Height
        const heightInCm = profile.demographics?.height;
        const savedUnit = localStorage.getItem(getUserKey('heightUnit')) || 'cm';
        document.getElementById('heightUnit').value = savedUnit;
        toggleHeightInput();

        if (heightInCm) {
          if (savedUnit === 'cm') {
            document.getElementById('heightValue').value = heightInCm;
          } else {
            const totalInches = Math.round(heightInCm / 2.54);
            document.getElementById('feet').value = Math.floor(totalInches / 12);
            document.getElementById('inches').value = totalInches % 12;
          }
        }

        // Health Domains
        const rawDomains = profile.healthDomains || [];
        const savedDomains = rawDomains.map(d => (typeof d === 'string' ? d : d.name));
        if ($('#healthDomains').length && !$('#healthDomains').data('select2')) {
          $('#healthDomains').select2({ placeholder: "Select health domains" });
        }
        $('#healthDomains').val(savedDomains).trigger('change');
        displaySelectedHealthDomains(savedDomains);

        // Avatar
        if (profile.avatarUrl) {
          const apiOrigin = window.API_BASE_ORIGIN || `${window.location.protocol}//${window.location.hostname}:8005`;
          avatarPreview.style.backgroundImage = `url(${apiOrigin}${profile.avatarUrl})`;
          avatarPreview.textContent = '';
        } else {
          const savedAvatarUrl = localStorage.getItem("avatarUrl");
          if (savedAvatarUrl) {
            avatarPreview.style.backgroundImage = `url(${savedAvatarUrl})`;
            avatarPreview.textContent = '';
          } else {
            avatarPreview.textContent = getUserInitials(fullName);
          }
        }


      } catch (error) {
        console.error("Error fetching profile:", error);
        // fallback from localStorage
        const savedDomains = JSON.parse(localStorage.getItem(getUserKey('healthDomains')) || '[]');
        if (savedDomains.length) displaySelectedHealthDomains(savedDomains);
      }
    }

    // Submit form handler
    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      let valid = true;

      const name = profileForm.name.value.trim();
      const email = profileForm.email.value.trim();
      const heightUnit = document.getElementById('heightUnit').value;

      document.getElementById('nameError').textContent = "";
      document.getElementById('emailError').textContent = "";

      if (!name) {
        document.getElementById('nameError').textContent = "Name is required.";
        valid = false;
      }
      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        document.getElementById('emailError').textContent = "Enter a valid email.";
        valid = false;
      }
      if (!valid) return;

      // Height conversion
      let heightInCm = 0;
      if (heightUnit === 'cm') {
        heightInCm = parseFloat(document.getElementById('heightValue').value);
      } else {
        const feet = parseFloat(document.getElementById('feet').value) || 0;
        const inches = parseFloat(document.getElementById('inches').value) || 0;
        heightInCm = (feet * 12 + inches) * 2.54;
      }

      const [firstName, ...lastNameParts] = name.split(' ');
      const lastName = lastNameParts.join(' ');
      const dob = document.getElementById('dob').value;
      const healthDomains = $('#healthDomains').val();

      const payload = {
        demographics: { firstName, lastName, dob, gender: profileForm.gender.value, height: heightInCm },
        healthDomains
      };

      try {
        const accessToken = localStorage.getItem('accessToken');
        const apiBaseUrl = window.API_BASE_URL || `${window.location.protocol}//${window.location.hostname}:8005/api`;
        const res = await fetch(`${apiBaseUrl}/profile/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${accessToken}`
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error((await res.json()).message || 'Failed to save profile.');

        alert('Profile saved successfully!');
        localStorage.setItem(getUserKey('heightUnit'), heightUnit);
        localStorage.setItem(getUserKey('healthDomains'), JSON.stringify(healthDomains));

      } catch (error) {
        console.error("Error saving profile:", error);
        alert("Error: " + error.message);
      }
    });

    async function uploadAvatarToServer(file) {
      const accessToken = localStorage.getItem('accessToken');
      const formData = new FormData();
      formData.append("file", file);

      try {
        const apiBaseUrl = window.API_BASE_URL || `${window.location.protocol}//${window.location.hostname}:8005/api`;
        const res = await fetch(`${apiBaseUrl}/profile/avatar`, {
          method: "PATCH",
          headers: {
            "Authorization": `Bearer ${accessToken}`
          },
          body: formData
        });

        if (!res.ok) throw new Error("Failed to upload avatar");

        const data = await res.json();
        console.log("✅ Avatar uploaded:", data.avatarUrl);

        // Save backend path locally so preview persists
        const apiOrigin = window.API_BASE_ORIGIN || `${window.location.protocol}//${window.location.hostname}:8005`;
        localStorage.setItem("avatarUrl", `${apiOrigin}${data.avatarUrl}`);
      } catch (err) {
        console.error("❌ Avatar upload error:", err);
      }
    }


    avatarUpload.addEventListener('change', function () {
      const file = this.files[0];
      if (file && file.type.startsWith('image/')) {
        // Show preview immediately
        const reader = new FileReader();
        reader.onload = function (e) {
          avatarPreview.style.backgroundImage = `url(${e.target.result})`;
          avatarPreview.textContent = '';
        };
        reader.readAsDataURL(file);

        // Upload to backend
        uploadAvatarToServer(file);
      }
    });


    document.getElementById('dob').addEventListener('change', function () {
      if (this.value) {
        const birthDate = new Date(this.value);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDifference = today.getMonth() - birthDate.getMonth();
        if (monthDifference < 0 || (monthDifference === 0 && today.getDate() < birthDate.getDate())) age--;
        document.getElementById('age').value = age;
      } else {
        document.getElementById('age').value = '';
      }
    });

    profileForm.name.addEventListener('input', () => {
      if (!localStorage.getItem('avatar')) {
        avatarPreview.textContent = getUserInitials(profileForm.name.value);
      }
    });

    document.getElementById('heightUnit').addEventListener('change', toggleHeightInput);

    $(document).ready(function () {
      if (!$('#healthDomains').data('select2')) {
        $('#healthDomains').select2({ placeholder: "Select health domains" });
      }
      $('#healthDomains').on('change', function () {
        const selectedDomains = $(this).val() || [];
        displaySelectedHealthDomains(selectedDomains);
      });

      window.addEventListener('healthDomainsUpdated', function (event) {
        const updatedDomains = event.detail.domains;
        $('#healthDomains').val(updatedDomains).trigger('change');
        displaySelectedHealthDomains(updatedDomains);
      });
    });

    window.addEventListener('DOMContentLoaded', fetchAndPopulateProfile);
  </script>


  <script>
    // Direct profile dropdown fix for Dashboard page
    document.addEventListener('DOMContentLoaded', function () {
      const profileCircle = document.getElementById('user-profile');
      const profileDropdown = document.getElementById('profileDropdown');

      if (profileCircle && profileDropdown) {
        // Add click handler
        profileCircle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();

          // Toggle dropdown
          if (profileDropdown.style.display === 'block') {
            profileDropdown.style.display = 'none';
          } else {
            profileDropdown.style.display = 'block';
            profileDropdown.style.position = 'absolute';
            profileDropdown.style.right = '0';
            profileDropdown.style.top = '100%';
            profileDropdown.style.backgroundColor = '#fff';
            profileDropdown.style.zIndex = '9999';
            profileDropdown.style.minWidth = '150px';
            profileDropdown.style.border = '1px solid #ddd';
            profileDropdown.style.borderRadius = '10px';
            profileDropdown.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';
            profileDropdown.style.padding = '10px 0';
          }
        });

        // Hide dropdown when clicking outside
        document.addEventListener('click', function (e) {
          if (!profileCircle.contains(e.target) && !profileDropdown.contains(e.target)) {
            profileDropdown.style.display = 'none';
          }
        });
      }
    });
  </script>

  <script>
    $('#healthDomains').select2({
      templateResult: function (option) {
        if (!option.id) return option.text;
        const icon = $(option.element).data('icon');
        return $('<span><i class="fa-solid ' + icon + '" style="margin-right:8px;"></i>' + option.text + '</span>');
      },
      templateSelection: function (option) {
        if (!option.id) return option.text;
        const icon = $(option.element).data('icon');
        return $('<span><i class="fa-solid ' + icon + '" style="margin-right:6px;"></i>' + option.text + '</span>');
      }
    });
  </script>


  <!-- <script src="scripts/profile.js"></script> -->
  <script src="scripts/navigation.js"></script>
</body>

</html>
