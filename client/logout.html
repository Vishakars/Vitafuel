<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logged Out - VitaFuel</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #fdf7ed;
      --text-color: #333;
      --card-bg: #fffdf7;
      --primary: #8c5e2a;
      --secondary: #a66f3f;
      --nav-bg: #f5e6c9;
      --footer-bg: #f5e6c9;
    }
    
    * {
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .logout-box {
      background-color: var(--card-bg);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      max-width: 700px;
      width: 100%;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logout-icon {
      font-size: 52px;
      margin-bottom: 20px;
      animation: wave 1.6s infinite ease-in-out;
    }

    @keyframes wave {
      0% {
        transform: rotate(0deg);
      }
      20% {
        transform: rotate(15deg);
      }
      40% {
        transform: rotate(-10deg);
      }
      60% {
        transform: rotate(10deg);
      }
      80% {
        transform: rotate(-5deg);
      }
      100% {
        transform: rotate(0deg);
      }
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--primary);
      font-weight: 700;
      font-size: large;
      padding: 12px 14px;
      border: 2px solid var(--primary);
      border-radius: 10px;
      transition: all 0.3s ease;
      overflow-wrap: break-word;
      text-align: center;
      white-space: nowrap;
      animation: pulse 3s infinite ease-in-out;
    }

    nav a:hover {
      background-color: var(--primary);
      color: white;
      transform: scale(1.05) translateY(-2px);
      animation: bounce 0.4s;
    }

    @keyframes bounce {
      0% {
        transform: scale(1) translateY(0);
      }
      30% {
        transform: scale(1.05) translateY(-6px);
      }
      50% {
        transform: scale(1) translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(140, 94, 42, 0.4);
      }
      50% {
        box-shadow: 0 0 10px 3px rgba(140, 94, 42, 0.2);
      }
    }

    .farewell-note {
      font-size: 0.95rem;
      color: #888;
      margin-top: 30px;
      font-style: italic;
    }

    /* QR code container */
    #qrcode {
      margin-top: 30px;
    }

    /* Center the QR code image */
    #qrcode img {
      width: 200px;
      height: 200px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      p {
        font-size: 1rem;
      }

      nav a {
        white-space: normal;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="logout-box">
    <div class="logout-icon">👋</div>
    <h1>You have been logged out!</h1>
    <p>Thanks for using <strong>VitaFuel</strong>. Choose where you'd like to go next:</p>

    <nav>
      <a href="login.html">Login</a>
    </nav>

    <!-- QR Code Container -->
    <div id="qrcode" aria-label="QR Code linking to VitaFuel website"></div>

    <div class="farewell-note">Come back soon — your wellness journey awaits <i class="fa-solid fa-leaf"></i></div>
  </div>

  <script>
    const urlToEncode = "login.html"; 
    const qrCodeSize = 200;

    const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${qrCodeSize}x${qrCodeSize}&data=${encodeURIComponent(urlToEncode)}`;

    const qrDiv = document.getElementById("qrcode");
    const img = document.createElement("img");
    img.src = qrCodeUrl;
    img.alt = "QR Code to access VitaFuel website";
    qrDiv.appendChild(img);
  </script>
</body>
</html>
